
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div>
            <h1>Student Attendance</h1>
            <p>Manage students, daily attendance and monthly reports</p>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <h2>Add Student</h2>

            <form id="student-form">
                <label for="roll-number">Roll Number</label>
                <input id="roll-number" type="text" required>

                <label for="student-name">Student Name</label>
                <input id="student-name" type="text" required>

                <label for="department">Department</label>
                <input id="department" type="text" required>

                <button type="submit">Add Student</button>
                <p id="student-message" role="status"></p>
            </form>
        </section>

        <section class="card">
            <h2>Mark Attendance</h2>

            <label for="attendance-date">Date</label>
            <input id="attendance-date" type="date" required>

            <label for="period">Period</label>
            <select id="period">
                <option value="1">Period 1</option>
                <option value="2">Period 2</option>
                <option value="3">Period 3</option>
                <option value="4">Period 4</option>
                <option value="5">Period 5</option>
                <option value="6">Period 6</option>
                <option value="7">Period 7</option>
            </select>

            <div id="attendance-list"></div>
            <p id="attendance-message" role="status"></p>
        </section>

        <section class="card">
            <h2>Monthly Attendance Report</h2>

            <div class="report-filters">
                <div>
                    <label for="report-year">Year</label>
                    <input id="report-year" type="number" min="2000" max="2100">
                </div>

                <div>
                    <label for="report-month">Month</label>
                    <select id="report-month">
                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                </div>
            </div>

            <button id="load-report" type="button">View Report</button>
            <a id="download-report" href="#">Download CSV</a>

            <div id="report-message" role="status"></div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Roll No.</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Total</th>
                            <th>Present</th>
                            <th>Absent</th>
                            <th>Attendance %</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="report-body"></tbody>
                </table>
            </div>
        </section>

        <section class="card">
            <h2>Student List</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Roll Number</th>
                            <th>Name</th>
                            <th>Department</th>
                        </tr>
                    </thead>
                    <tbody id="student-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
